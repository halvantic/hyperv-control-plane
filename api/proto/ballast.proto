syntax = "proto3";

// Package ballast.v1 is the agent <-> centre gRPC contract for Ballast.
//
// The Go desired-state schema in api/types is the source of truth. These
// messages mirror it for transport only; the single mapping between the two
// lives in api/proto/convert.go so the wire form can never silently diverge
// from the schema. Extend this file in lockstep with api/types, never alone.
package ballast.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/joshua-fourie/ballast/api/proto;ballastpb";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

// AgentService is served by the centre and consumed by each host agent. It is
// deliberately small: announce, pull desired state, report status. The centre
// never imperatively drives a host through this service; it only serves desired
// state and accepts reported status.
service AgentService {
  // RegisterHost announces an agent to the centre on startup and reports
  // initial inventory. The centre returns the host identity (UID) the agent
  // should use for subsequent calls. Calling it again with the same host name
  // is idempotent and returns the existing identity.
  rpc RegisterHost(RegisterHostRequest) returns (RegisterHostResponse);

  // PullDesiredState returns the current desired Host for the calling agent,
  // plus any cluster assignment. The agent caches the result as its
  // last-honoured state and keeps enforcing it if the centre later becomes
  // unreachable.
  rpc PullDesiredState(PullDesiredStateRequest) returns (PullDesiredStateResponse);

  // ReportStatus delivers an agent's observed status to the centre, carrying
  // ObservedGeneration and the Autonomous flag so the centre can tell whether
  // an object is settled and whether the agent is running on cached state.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);

  // ReportJobResult reports the outcome of an imperative Job the agent ran
  // locally (Running while in flight, then Succeeded/Failed).
  rpc ReportJobResult(ReportJobResultRequest) returns (ReportJobResultResponse);
}

message RegisterHostRequest {
  // host_name is the stable, human-meaningful host identifier (ObjectMeta.Name).
  string host_name = 1;
  // fqdn the agent believes it is reachable as.
  string fqdn = 2;
  // inventory observed at registration time (physical adapters at minimum).
  HostInventory inventory = 3;
  // agent_version for diagnostics and compatibility checks.
  string agent_version = 4;
}

message RegisterHostResponse {
  // uid is the immutable identity the centre assigns (or has) for this host.
  string uid = 1;
  // known is true when the centre already had desired state for this host.
  bool known = 2;
}

message PullDesiredStateRequest {
  string host_name = 1;
  string uid = 2;
  // known_generation lets the centre answer cheaply when nothing changed; the
  // agent sends the Generation it currently holds, 0 if it holds none.
  int64 known_generation = 3;
}

message PullDesiredStateResponse {
  // has_desired_state is false when the centre has no Host assigned yet.
  bool has_desired_state = 1;
  // unchanged is true when known_generation already matches the centre's
  // Generation, in which case host may be omitted.
  bool unchanged = 2;
  Host host = 3;
  // cluster_assignment tells the host whether it belongs to a cluster and
  // whether it is the designated former. Absent when the host is standalone.
  ClusterAssignment cluster_assignment = 4;
  // vms are the virtual machines placed on this host (Spec.Placement.HostName
  // == this host). Always sent in full — unlike host, it is not gated by
  // known_generation, since VMs change independently of the host spec.
  repeated VM vms = 5;
  // secrets are the credentials this host's desired state references (e.g. a
  // domain-join account), resolved and decrypted for delivery over this
  // channel. Only the secrets the host actually needs are sent.
  repeated Secret secrets = 6;
  // jobs are pending imperative actions for this host to execute locally.
  repeated Job jobs = 7;
}

message Job {
  string id = 1;
  string host_name = 2;
  string kind = 3;
  map<string, string> params = 4;
  string state = 5;
  string message = 6;
}

message ReportJobResultRequest {
  string host_name = 1;
  string uid = 2;
  string job_id = 3;
  string state = 4;   // Running / Succeeded / Failed
  string message = 5;
}

message ReportJobResultResponse {
  bool accepted = 1;
}

message Secret {
  string name = 1;
  string type = 2;
  map<string, string> data = 3;
}

message ReportStatusRequest {
  string host_name = 1;
  string uid = 2;
  HostStatus status = 3;
  // cluster_name and cluster_status are set when the host is a cluster member
  // and has observed cluster state to report (typically from the former).
  string cluster_name = 4;
  ClusterStatus cluster_status = 5;
  // vm_statuses reports the observed state of the VMs this host owns. Each
  // entry is keyed by VM name. Empty when the host owns no VMs.
  repeated VMStatusReport vm_statuses = 6;
  // keepalive marks a report the agent RESENT between reconcile passes to hold
  // its contact time open, rather than one built from a fresh look at the host.
  // The payload is identical to the last real report, so without this flag the
  // centre cannot tell the two apart and every replay re-dates readings that
  // nobody took. It refreshes LastContact and nothing else.
  bool keepalive = 7;
}

// VMStatusReport pairs a VM's name with its reported status, so one host can
// report on all the VMs it owns in a single call.
message VMStatusReport {
  string name = 1;
  VMStatus status = 2;
}

message ReportStatusResponse {
  // accepted is false if the centre rejected the report (e.g. unknown host).
  bool accepted = 1;
}

// ---------------------------------------------------------------------------
// Common envelope (mirrors api/types ObjectMeta, Phase, Condition)
// ---------------------------------------------------------------------------

message ObjectMeta {
  string name = 1;
  string uid = 2;
  int64 generation = 3;
  map<string, string> labels = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_PENDING = 1;
  PHASE_PROGRESSING = 2;
  PHASE_READY = 3;
  PHASE_DEGRADED = 4;
  PHASE_ERROR = 5;
}

message Condition {
  string type = 1;
  bool status = 2;
  string reason = 3;
  string message = 4;
  google.protobuf.Timestamp last_transition_time = 5;
}

// ---------------------------------------------------------------------------
// Host
// ---------------------------------------------------------------------------

message Host {
  ObjectMeta meta = 1;
  HostSpec spec = 2;
  HostStatus status = 3;
}

enum RebootPolicy {
  REBOOT_POLICY_UNSPECIFIED = 0;
  REBOOT_POLICY_NEVER = 1;
  REBOOT_POLICY_IF_NEEDED = 2;
}

message HostSpec {
  string fqdn = 1;
  bool enable_hyperv_role = 2;
  HostNetworkingSpec networking = 3;
  HostStorageSpec storage = 4;
  // cluster_membership is optional; absence means standalone.
  ClusterMembershipSpec cluster_membership = 5;
  // windows_licence declares the Windows EDITION this host should run. The
  // conversion is irreversible, so an absent declaration converts nothing.
  WindowsLicenceSpec windows_licence = 20;
  RebootPolicy reboot_policy = 6;
  string computer_name = 7;
  PhysicalNICConfig management_nic = 8;
  DomainJoinSpec domain_join = 9;
  LiveMigrationSpec live_migration = 10;
  // replica_server, when set, makes this host accept Hyper-V Replica traffic.
  ReplicaServerSpec replica_server = 11;
  // maintenance takes the host out of service for planned work. It MUST cross
  // the wire: the centre stores the intent but the agent is what drains the
  // node, so a field the proto drops means the operator asks and nothing
  // happens — the console shows "draining" for ever over a node still running
  // their VMs.
  MaintenanceSpec maintenance = 12;
  // iso_library is the SMB share a STANDALONE host mounts boot media from. A
  // cluster member's library comes from ClusterSpec instead and is never fanned
  // here, so there is no copy to outlive an eviction.
  ISOLibrarySpec iso_library = 13;
}

// ISOLibrarySpec is an SMB share holding boot media, referenced rather than
// copied. Hyper-V attaches an ISO as the node's COMPUTER ACCOUNT (VMMS runs as
// LocalSystem), so the share must grant those, not the operator.
message ISOLibrarySpec {
  // path is the UNC share. Use the FQDN so Kerberos can find an SPN.
  string path = 1;
  // credential_secret optionally names a stored credential for the agent's own
  // reads. It does NOT change how Hyper-V attaches media.
  string credential_secret = 2;
}

// ISOLibraryStatus is one host's view of its declared library. readable and
// machine_readable answer different questions and can disagree: the agent reads
// as its service account, Hyper-V as the computer account.
message ISOLibraryStatus {
  string path = 1;
  bool readable = 2;
  // machine_readable is optional on purpose: unset means "not established",
  // which is not the same as false and must not render as a failure.
  optional bool machine_readable = 3;
  string message = 4;
  repeated string isos = 5;
  google.protobuf.Timestamp checked_at = 6;
}

// MaintenanceSpec declares a host is deliberately out of service.
message MaintenanceSpec {
  bool enabled = 1;
  string reason = 2;
}

// ReplicaServerSpec makes a host a Hyper-V Replica target.
message ReplicaServerSpec {
  bool enabled = 1;
  // authentication_type is Kerberos or Certificate; empty defaults to Kerberos.
  string authentication_type = 2;
  // port 0 defaults to 80 for Kerberos.
  int32 port = 3;
  // default_storage_location is where inbound replica VHDs land (a CSV path on
  // cluster members). Empty defaults to C:\Hyper-V\Replica.
  string default_storage_location = 4;
}

// LiveMigrationSpec configures host live migration.
message LiveMigrationSpec {
  bool enabled = 1;
  string authentication_type = 2;
  int32 max_concurrent = 3;
  repeated string networks = 4;
}

message PhysicalNICConfig {
  string adapter_name = 1;
  IPConfig ip_config = 2;
}

message DomainJoinSpec {
  string domain_name = 1;
  string ou_path = 2;
  string credential_secret = 3;
}

message HostStatus {
  // This host's own membership state and cluster service state. Reported per
  // host because the cluster's node list comes from one member, and that member
  // is exactly what is missing when it is the broken one.
  string cluster_node = 70;
  string cluster_service = 71;
  // cluster_node_of is WHICH cluster the host is in. cluster_node and
  // cluster_service say how its membership is, never of what — so a host still
  // joined to a cluster somebody thought they had removed reports Up and
  // healthy. Compared against the authored cluster, this separates "joined to
  // what I asked for" from "joined to something else". See HostStatus in
  // api/types.
  string cluster_node_of = 72;

  Phase phase = 1;
  int64 observed_generation = 2;
  bool hyperv_installed = 3;
  bool reboot_required = 4;
  bool autonomous = 5;
  google.protobuf.Timestamp last_contact = 6;
  HostInventory inventory = 7;
  repeated Condition conditions = 8;
  HostMetrics metrics = 9;
  HostResources resources = 10;
  string computer_name = 11;
  string domain = 12;
  string agent_version = 13;
  // network_profile is the weakest connection-profile category on the host
  // (Public/Private/DomainAuthenticated); a management NIC off the domain profile
  // breaks cross-node WMI/clustering.
  string network_profile = 14;
  // observed_vms_json is every VM present on the host (managed or not), each an
  // ObservedVM marshalled as JSON — how the centre discovers VMs on existing
  // infrastructure so the UI can list and adopt them.
  repeated string observed_vms_json = 15;
  // in_maintenance is OBSERVED: the node is actually out of service, roles gone
  // and (on S2D) its storage out of the pool. Without it the centre could never
  // tell "asked to drain" from "drained".
  bool in_maintenance = 16;
  // iso_library is what this host actually found at its declared library share,
  // whether the cluster's or its own.
  ISOLibraryStatus iso_library = 17;
  // iscsi is a STANDALONE host's own array connection. A member's iSCSI state is
  // reported per node on the cluster, where members can be compared.
  ISCSIStatus iscsi = 18;
  // windows_licence is the host's Windows edition and activation state. Named
  // for Windows deliberately: Ballast's own product licensing is a separate
  // concern the agent is never aware of.
  WindowsLicenceStatus windows_licence = 19;
}

message WindowsLicenceSpec {
  string edition = 1;
  // product_key_secret NAMES a stored secret; the key itself never crosses here.
  string product_key_secret = 2;
  // activation is MAK, KMS, or empty for neither — a separate act from the
  // conversion, on a different schedule and with a different cost.
  string activation = 3;
  string activation_key_secret = 4;
  string kms_server = 5;
}

message WindowsLicenceStatus {
  string edition = 1;
  string description = 2;
  // evaluation marks an edition that CANNOT be activated by any key — it must be
  // converted first. The most consequential field here.
  bool evaluation = 3;
  string status = 4;
  int32 grace_days_remaining = 5;
  string channel = 6;
  string partial_product_key = 7;
  string kms_server = 8;
  string message = 9;
  // What this installation may convert to, as Windows reports it. Empty means
  // not reported, not "nothing is possible".
  repeated string target_editions = 10;
}

message HostMetrics {
  int32 cpu_usage_percent = 1;
  uint64 memory_in_use_bytes = 2;
  int64 uptime_seconds = 3;
}

message HostResources {
  repeated string switches = 1;
  repeated StorageVolume volumes = 2;
  repeated string isos = 3;
  repeated VirtualSwitchInfo switch_details = 4;
  repeated ManagementVNICInfo management_vnics = 5;
}

message ManagementVNICInfo {
  string name = 1;
  string switch_name = 2;
  int32 vlan_id = 3;
  repeated string dns_servers = 4;
  string profile = 5;
  repeated VNICAddress addresses = 6;
  // gateway is the IPv4 default-route next hop on this vNIC, empty when it has
  // none. Having a gateway is what makes a management vNIC routable, as opposed
  // to an isolated storage/live-migration one, so anything reconstructing a spec
  // from observation needs it. See ManagementVNICInfo in api/types.
  string gateway = 7;
}

message VNICAddress {
  string address = 1;
  string kind = 2;
}

message VirtualSwitchInfo {
  string name = 1;
  repeated string net_adapters = 2;
  bool allow_management_os = 3;
  int32 vlan_id = 4;
}

message StorageVolume {
  string name = 1;
  string path = 2;
  uint64 size_bytes = 3;
  uint64 used_bytes = 4;
}

message HostInventory {
  repeated PhysicalAdapter physical_adapters = 1;
  repeated PhysicalDisk physical_disks = 2;
  uint64 total_memory_bytes = 3;
  int32 logical_cpus = 4;
  string os_version = 5;
  repeated string used_drive_letters = 6;
}

message PhysicalAdapter {
  string name = 1;
  string mac = 2;
  uint64 link_speed_bps = 3;
  bool up = 4;
  bool is_management = 5;
  string ipv4 = 6;
  // dns_servers are the IPv4 DNS servers configured on this adapter; registers_dns
  // is whether the adapter registers its address in DNS. Used to flag a NIC whose
  // DNS does not point at the domain controller (a domain-join/registration risk).
  repeated string dns_servers = 7;
  bool registers_dns = 8;
  // gateway is the IPv4 default-route next hop on this adapter, captured so a
  // management IP re-homed onto a converged switch's vNIC keeps the host's
  // default route. Empty when the adapter has no default route.
  string gateway = 9;
  // prefix_length is the IPv4 prefix of the address in ipv4 (e.g. 24), so the
  // UI can prefill an exact CIDR when re-homing the address onto a management
  // vNIC. Zero when ipv4 is empty.
  int32 prefix_length = 10;
}

message PhysicalDisk {
  string device_id = 1;
  uint64 size_bytes = 2;
  string media_type = 3;
  bool can_pool = 4;
  bool is_os_disk = 5;
  string drive_letter = 6;
  // unique_id identifies the disk without ambiguity; device_id is unique per bus
  // only, so a destructive operation must select on this.
  string unique_id = 7;
  string bus_type = 8;
  // pool_name is the storage pool holding this disk, empty when it is in none.
  // Without it the console could only infer pool membership from can_pool, which
  // is false for a dozen unrelated reasons.
  string pool_name = 9;
  // cannot_pool_reason is Windows' own reason the disk cannot join a pool ("In a
  // Pool", "Insufficient Capacity", "Removable Media", …). Empty when it can.
  string cannot_pool_reason = 10;
  // usage is PhysicalDisk.Usage — "Auto-Select", "Retired", "Journal", "Hot
  // Spare". Independent of health: a RETIRED disk reports Healthy and
  // contributes nothing, which is why a pool of healthy disks can be unable to
  // create a volume. See PhysicalDisk in api/types.
  string usage = 11;
}

// ---------------------------------------------------------------------------
// Networking
// ---------------------------------------------------------------------------

message HostNetworkingSpec {
  repeated VirtualSwitchSpec switches = 1;
  repeated ManagementVNICSpec management_vnics = 2;
  repeated string dns_servers = 3;
  repeated PhysicalNICConfig nic_configs = 4;
}

enum SETTeamingMode {
  SET_TEAMING_MODE_UNSPECIFIED = 0;
  SET_TEAMING_MODE_SWITCH_INDEPENDENT = 1;
}

enum SETLoadBalancing {
  SET_LOAD_BALANCING_UNSPECIFIED = 0;
  SET_LOAD_BALANCING_HYPERV_PORT = 1;
  SET_LOAD_BALANCING_DYNAMIC = 2;
}

message VirtualSwitchSpec {
  string name = 1;
  repeated string team_members = 2;
  SETTeamingMode teaming_mode = 3;
  SETLoadBalancing load_balancing = 4;
  bool allow_management_os = 5;
}

message ManagementVNICSpec {
  string name = 1;
  string switch_name = 2;
  int32 vlan_id = 3;
  // ip_config absent means DHCP.
  IPConfig ip_config = 4;
  int32 min_bandwidth_weight = 5;
  // What this vNIC carries: "" (management), Cluster, LiveMigration, Storage.
  // Storage traffic has requirements no other traffic has, and the model could
  // not say which vNIC carried it.
  string purpose = 6;
  // The ONE physical adapter in the switch's SET team this vNIC is pinned to
  // (Set-VMNetworkAdapterTeamMapping). Without it SET places vNICs freely, so
  // two storage vNICs on two subnets can share one uplink and the redundancy is
  // decorative. Empty leaves placement to SET.
  string team_member_adapter = 7;
  // RDMA on this vNIC. Optional so that "not set" and "off" stay distinct: RDMA
  // needs capable adapters and, for RoCE, DCB end to end.
  optional bool rdma = 8;
}

message IPConfig {
  string address = 1;
  string gateway = 2;
  repeated string dns_servers = 3;
}

// ---------------------------------------------------------------------------
// Storage / Cluster
// ---------------------------------------------------------------------------

message HostStorageSpec {
  bool contribute_to_s2d = 1;
  map<string, string> eligible_disk_selector = 2;
  // default_vm_path / default_vhd_path set the host's default VM config and VHD
  // directories (Set-VMHost); a CSV path makes VMs migration-ready.
  string default_vm_path = 3;
  string default_vhd_path = 4;
  // iscsi connects a STANDALONE host to its own array. A cluster member takes
  // its initiator configuration from the cluster instead; declaring both is
  // refused rather than resolved by precedence.
  ISCSIStorageSpec iscsi = 5;
}

message ClusterMembershipSpec {
  string cluster_name = 1;
}

// ClusterAssignment is delivered to an agent that belongs to a cluster. It
// names whether this host is the designated former (the single member that runs
// Test-Cluster/New-Cluster) and carries the cluster's desired state so the
// former can act on it. Non-formers use it to know their cluster and report.
message ClusterAssignment {
  bool is_member = 1;
  bool is_former = 2;
  Cluster cluster = 3;
}

message Cluster {
  ObjectMeta meta = 1;
  ClusterSpec spec = 2;
  ClusterStatus status = 3;
}

message ClusterSpec {
  // members are the host names that should form the cluster.
  repeated string members = 1;
  // management_ip is the cluster's virtual management address (CIDR or plain).
  string management_ip = 2;
  WitnessSpec witness = 3;
  // enable_s2d requests Storage Spaces Direct once the cluster is formed.
  bool enable_s2d = 4;
  // volumes are the Cluster Shared Volumes to provision on the S2D pool.
  repeated CSVSpec volumes = 5;
  // live_migration is the cluster-wide live-migration config, delivered to the
  // former so it can configure Kerberos constrained delegation between nodes.
  LiveMigrationSpec live_migration = 6;
  // replica_broker provisions the Hyper-V Replica Broker role (former only).
  ReplicaBrokerSpec replica_broker = 7;
  // iso_library is the SMB share every member mounts boot media from, read by
  // each member from its cluster assignment rather than fanned into host specs.
  ISOLibrarySpec iso_library = 8;
  // storage selects the shared-storage model. Unset falls back to enable_s2d,
  // so a cluster authored before this existed keeps working unchanged.
  ClusterStorageSpec storage = 9;
}

// ReplicaBrokerSpec is the Hyper-V Replica Broker cluster role: a client
// access point plus the broker resource. Replication addresses the broker.
message ReplicaBrokerSpec {
  string name = 1;
  string static_ip = 2;
  string storage_path = 3;
}

message CSVSpec {
  string name = 1;
  // size_bytes, resiliency_type and number_of_copies are S2D ONLY — what Ballast
  // asks the pool to provision. Under iSCSI the array decided all three before
  // Ballast saw the LUN, so they carry no meaning and the reconciler ignores them.
  uint64 size_bytes = 2;
  // resiliency_type is Mirror or Parity; empty defaults to Mirror.
  string resiliency_type = 3;
  int32 number_of_copies = 4;
  // source identifies an EXISTING disk to adopt, for kinds where Ballast does
  // not create the volume. Required under iSCSI.
  CSVSourceSpec source = 5;
}

// CSVSourceSpec binds a volume to a disk the array presents. The serial is the
// identifier that means the same thing on every node — LUN numbers are
// per-target and disk numbers are per-node and move across reboots.
message CSVSourceSpec {
  string serial_number = 1;
  string target_iqn = 2;
  optional int32 lun = 3;
}

// ClusterStorageKind names how shared storage is provided. It is a discriminator
// because the models do not overlap: an iSCSI cluster has no pool, so pool
// capacity, resiliency and repair are meaningless rather than empty.
enum ClusterStorageKind {
  CLUSTER_STORAGE_KIND_UNSPECIFIED = 0;
  CLUSTER_STORAGE_KIND_S2D = 1;
  CLUSTER_STORAGE_KIND_ISCSI = 2;
}

message ClusterStorageSpec {
  ClusterStorageKind kind = 1;
  ISCSIStorageSpec iscsi = 2;
}

// ISCSIStorageSpec connects every member to an iSCSI array. Ballast owns the
// INITIATOR side only: service, portals, logins, persistence. LUN creation,
// sizing and redundancy belong to the array.
message ISCSIStorageSpec {
  // portals are discovery addresses. More than one is what MPIO needs.
  repeated string portals = 1;
  // targets are the IQNs to log in to; empty means every target advertised.
  repeated string targets = 2;
  // credential_secret names a stored CHAP credential — a reference, not a value,
  // because the spec reaches every member and every spec-history row.
  string credential_secret = 3;
  bool mutual_chap = 4;
  // enable_mpio is optional so "unset" can default from the portal count.
  // Multiple paths without MPIO makes Windows present one LUN as several disks,
  // and a cluster writing to two of them corrupts data — so it is not a
  // preference that can be honoured when several portals are declared.
  optional bool enable_mpio = 5;
}

// ISCSIStatus is ONE NODE's observed iSCSI state. Per-node because that is how
// iSCSI fails: one member loses a path while the others are fine, and a single
// cluster-wide "connected" would hide the one condition worth reporting.
message ISCSIStatus {
  string node = 1;
  // initiator_iqn is what the array grants the LUN to. Knowable only on the
  // host, so without it an operator opens a session on every node to collect
  // them before they can configure anything.
  string initiator_iqn = 8;
  bool service_running = 2;
  repeated string portals = 3;
  repeated ISCSISession sessions = 4;
  bool mpio_installed = 5;
  repeated ISCSIDisk disks = 6;
  string message = 7;
  // mpio_effective is multipath actually protecting the node: installed,
  // claiming iSCSI devices, and restarted into. Installed alone protects nothing.
  bool mpio_effective = 9;
}

message ISCSISession {
  string target_iqn = 1;
  bool connected = 2;
  // persistent means the login is restored at boot. Without it a node works
  // until it reboots and then its disks simply do not arrive.
  bool persistent = 3;
  int32 paths = 4;
}

message ISCSIDisk {
  // serial_number is the cluster-wide identity of the LUN.
  string serial_number = 1;
  int32 number = 2;
  uint64 size_bytes = 3;
  string target_iqn = 4;
  int32 lun = 5;
  bool clustered = 6;
  // offline is NORMAL for a clustered disk on a non-owner and a problem on the
  // owner, so it is reported rather than judged here.
  bool offline = 7;
}

enum WitnessType {
  WITNESS_TYPE_UNSPECIFIED = 0;
  WITNESS_TYPE_NONE = 1;
  WITNESS_TYPE_FILE_SHARE = 2;
  WITNESS_TYPE_CLOUD = 3;
  WITNESS_TYPE_DISK = 4;
}

message WitnessSpec {
  WitnessType type = 1;
  string file_share_path = 2;
  string cloud_account = 3;
  // disk identifies the LUN behind a Disk witness, the same way a volume
  // identifies its own. Adopted as a clustered disk, never as a CSV.
  CSVSourceSpec disk = 4;
}

message ClusterStatus {
  // The reporting member could not read the cluster at all: every observed field
  // is empty because nothing was seen, not because nothing is there.
  bool state_unreadable = 60;

  Phase phase = 1;
  int64 observed_generation = 2;
  repeated string formed_members = 3;
  bool s2d_enabled = 4;
  repeated Condition conditions = 5;
  // groups are the clustered roles/groups and their current owner node.
  repeated ClusterGroup groups = 6;
  // csvs are the Cluster Shared Volumes and their current owner node.
  repeated ClusterCSV csvs = 7;
  // cluster_vms are the highly-available VM roles and their current owner node.
  repeated ClusterVM cluster_vms = 8;
  // nodes are the cluster nodes with their state (Up/Paused/Down).
  repeated ClusterNode nodes = 9;
  // pool is the S2D storage pool capacity, when one exists.
  ClusterPool pool = 10;
  // networks are the cluster's networks (subnet, role, state).
  repeated ClusterNetwork networks = 11;
  // witness is the observed quorum configuration. Unset means the former has
  // not reported quorum yet, which is not the same as having no witness.
  ClusterWitness witness = 12;
  // replica_broker is the observed Hyper-V Replica Broker. Set while the spec
  // declares none means the cluster runs a replication endpoint Ballast does
  // not manage.
  ClusterReplicaBroker replica_broker = 13;
  // functional_level is the cluster's operating mode (9=2016, 10=2019, 11=2022,
  // 12=2025). A rolling OS upgrade does not raise it, so a cluster can run every
  // node on a newer Windows and still operate at the old level until
  // Update-ClusterFunctionalLevel is run.
  int32 functional_level = 14;
  // node_os_build is the reporting node's Windows build, which bounds the level
  // the cluster could run at.
  int32 node_os_build = 15;
  // iscsi is the observed iSCSI state, ONE ENTRY PER MEMBER. An agent sends only
  // its own; the centre merges on receipt. A single value would be overwritten
  // by whichever node reported last, hiding the one-member-at-a-time failure
  // that is how iSCSI actually breaks.
  repeated ISCSIStatus iscsi = 16;
}

// ClusterReplicaBroker is the Hyper-V Replica Broker as observed on the cluster.
message ClusterReplicaBroker {
  // name is the client access point a primary replicates to, not the cluster
  // resource's own name.
  string name = 1;
  // state is the broker resource's cluster state; Online when it can serve.
  string state = 2;
  // storage_location is where an incoming replica's VHDs land, read from the
  // replication authorization entry. On a cluster it is a CSV path, so deleting
  // the volume leaves relationships pointing at a directory that is not there.
  string storage_location = 3;
}

// ClusterWitness is quorum as observed on the cluster, not as requested.
message ClusterWitness {
  // type is what is actually configured: None, FileShare, Cloud or Disk.
  WitnessType type = 1;
  // path is the UNC share for a file-share witness, or the storage account
  // name for a cloud one.
  string path = 2;
  // state is the witness resource's state. A configured witness that is not
  // Online is not voting, which only becomes visible once a node is lost.
  string state = 3;
  // quorum_type is the cluster's quorum model as Failover Clustering names it.
  string quorum_type = 4;
}

message ClusterNetwork {
  string name = 1;
  string cidr = 2;
  string role = 3;
  string state = 4;
  // metric decides which network actually carries cluster and CSV/SMB traffic:
  // among networks enabled for cluster use, the lowest metric wins. Role alone
  // does not answer "where is storage traffic going".
  int32 metric = 5;
}

message ClusterNode {
  string name = 1;
  string state = 2;
  // status_information is what Failover Clustering says about the state
  // ("Quarantined", "Isolated", "Normal"). A quarantined node reports
  // state=Down exactly like a switched-off one, and the two need opposite
  // responses — see ClusterNodeStatus in api/types.
  string status_information = 3;
}

message ClusterPool {
  string name = 1;
  uint64 raw_bytes = 2;
  uint64 allocated_bytes = 3;
  // health is the pool HealthStatus ("Healthy"/"Warning"/"Unhealthy") and
  // operational the OperationalStatus (e.g. "Degraded"); unhealthy_disks /
  // total_disks are the pool's physical-disk health counts. A CSV cannot be
  // provisioned while the pool is not Healthy.
  string health = 4;
  string operational = 5;
  int32 unhealthy_disks = 6;
  int32 total_disks = 7;
  // resyncing reports an observed repair/regeneration job, with its completion
  // and kind. A rebuilding pool reports non-Healthy transiently; without this
  // the centre cannot tell it apart from one that is genuinely broken.
  bool resyncing = 8;
  int32 resync_percent = 9;
  string resync_job = 10;
  // resync_remaining_bytes is the outstanding work across the running jobs. The
  // percentage resets when one job ends and the next begins, so it cannot show
  // overall progress; this can, and separates a converging rebuild from one that
  // keeps restarting.
  uint64 resync_remaining_bytes = 11;
  // disks_in_maintenance counts disks the cluster took into storage maintenance
  // mode, and is EXCLUDED from unhealthy_disks. Suspend-ClusterNode -Drain puts
  // a node's disks there and Resume takes them out; while out they report
  // HealthStatus Warning, so folding them into the failure count made every
  // planned drain read as broken hardware and offered a pool repair for it.
  int32 disks_in_maintenance = 12;
}

// ClusterGroup is one clustered role/group as observed by the cluster.
message ClusterGroup {
  string name = 1;
  string owner_node = 2;
  string state = 3;
  string group_type = 4;
  // The group's resources, collected only when the group is not Online. A group
  // state names the group and not the fault: which resource is down is the whole
  // question, and for a group Failover Cluster Manager does not display there is
  // nowhere else for the operator to read it.
  repeated ClusterResource resources = 5;
}

// ClusterResource is one resource inside a cluster group.
message ClusterResource {
  string name = 1;
  string type = 2;
  string state = 3;
}

// ClusterCSV is one Cluster Shared Volume as observed by the cluster.
message ClusterCSV {
  string name = 1;
  string owner_node = 2;
  string state = 3;
  // Health of the backing virtual disk, observed separately from pool health —
  // a volume and its pool fail independently. detached_reason "By Policy" is the
  // normal resting state for a clustered volume, not a fault.
  string health = 4;
  string operational = 5;
  string detached_reason = 6;
  // The VOLUME's capacity, not the backing virtual disk's: a grow that reached
  // the virtual disk but not the filesystem leaves those two disagreeing, and
  // the volume is the one that says what is usable. Carried so a CSV's declared
  // size can be compared with reality.
  uint64 size_bytes = 7;
  uint64 free_bytes = 8;
}

// ClusterVM is one highly-available VM role as observed by the cluster.
message ClusterVM {
  string name = 1;
  string owner_node = 2;
  string state = 3;
}

// ---------------------------------------------------------------------------
// Virtual machine
// ---------------------------------------------------------------------------

enum VMPowerState {
  VM_POWER_STATE_UNSPECIFIED = 0;
  VM_POWER_STATE_RUNNING = 1;
  VM_POWER_STATE_OFF = 2;
  VM_POWER_STATE_PAUSED = 3;
  VM_POWER_STATE_SAVED = 4;
}

enum VMStartAction {
  VM_START_ACTION_UNSPECIFIED = 0;
  VM_START_ACTION_NOTHING = 1;
  VM_START_ACTION_START_IF_RUNNING = 2;
  VM_START_ACTION_START = 3;
}

message VM {
  ObjectMeta meta = 1;
  VMSpec spec = 2;
  VMStatus status = 3;
}

message VMSpec {
  VMPlacementSpec placement = 1;
  // hyperv_generation is 1 or 2; 0 is treated as 2 by the agent.
  int32 hyperv_generation = 2;
  int32 processor_count = 3;
  uint64 memory_startup_bytes = 4;
  // dynamic_memory absent means a fixed memory assignment.
  DynamicMemorySpec dynamic_memory = 5;
  repeated VMDiskSpec disks = 6;
  repeated VMNetworkAdapterSpec network_adapters = 7;
  VMPowerState desired_power_state = 8;
  VMStartAction automatic_start_action = 9;
  string iso_path = 10;
  // replication, when set, replicates this VM with Hyper-V Replica.
  VMReplicationSpec replication = 11;
  // secure_boot is the Gen 2 UEFI Secure Boot policy: "" or "windows" for the
  // Microsoft Windows template, "linux" for the Microsoft UEFI CA template
  // (required by most Linux guests), "off" to disable it.
  string secure_boot = 12;
  // boot_order is the firmware boot priority as device categories, most
  // preferred first: "Drive", "DVD", "Network", and "Floppy" on Gen 1. Empty
  // leaves the boot order unmanaged.
  repeated string boot_order = 13;
  // computer_name is the guest OS hostname, which is not the VM's name.
  string computer_name = 14;
}

// VMReplicationSpec declares Hyper-V Replica for one VM. replica_server is the
// address replication points at (host FQDN or a broker client access point).
message VMReplicationSpec {
  bool enabled = 1;
  string target_host = 2;
  string target_cluster = 3;
  string replica_server = 4;
  // frequency_seconds is 30, 300 or 900; 0 defaults to 300.
  int32 frequency_seconds = 5;
  string authentication_type = 6;
  int32 port = 7;
}

message VMPlacementSpec {
  string host_name = 1;
  // cluster_name, when set, places the VM as an HA cluster role instead of on a
  // single host. Mutually exclusive with host_name.
  string cluster_name = 2;
}

message DynamicMemorySpec {
  uint64 min_bytes = 1;
  uint64 max_bytes = 2;
}

message VMDiskSpec {
  string path = 1;
  // size_bytes 0 means the VHDX already exists at path and is attached as-is.
  uint64 size_bytes = 2;
  bool dynamic = 3;
}

message VMNetworkAdapterSpec {
  string name = 1;
  string switch_name = 2;
  int32 vlan_id = 3;
  // mac_address empty means a dynamic, host-assigned MAC.
  string mac_address = 4;
}

message VMStatus {
  Phase phase = 1;
  int64 observed_generation = 2;
  VMPowerState power_state = 3;
  uint64 assigned_memory_bytes = 4;
  int32 cpu_usage_percent = 5;
  int64 uptime_seconds = 6;
  repeated Condition conditions = 7;
  bytes screen_png = 8;
  string vm_id = 9;
  string guest_os = 10;
  string ip_address = 11;
  string guest_fqdn = 12;
  repeated VMCheckpoint checkpoints = 13;
  string observed_json = 14; // VMObserved marshalled as JSON (CPU/mem/disks/adapters)
  // replication is the VM's observed Hyper-V Replica state, when it has one.
  VMReplicationStatus replication = 15;
  // memory_demand_bytes is what the guest actually wants; assigned memory equals
  // startup on a static-memory VM and so cannot express usage. Zero when the VM
  // is off or integration services are not reporting. memory_status is Hyper-V's
  // verdict ("OK"/"Low"/"Warning").
  uint64 memory_demand_bytes = 16;
  string memory_status = 17;
  // heartbeat is the integration layer's verdict on the guest (Ok*, Lost,
  // NoContact, Error). Empty is unknown, not healthy.
  string heartbeat = 18;
  // screen_blank means the captured thumbnail is one flat colour: the display
  // is powered down. It does NOT mean the session is locked.
  bool screen_blank = 19;
}

// VMReplicationStatus is a VM's observed Hyper-V Replica state.
message VMReplicationStatus {
  string mode = 1;   // Primary | Replica
  string state = 2;  // Replicating, InitialReplication, Error, ...
  string health = 3; // Normal | Warning | Critical
  string primary_server = 4;
  string replica_server = 5;
  string last_replication_time = 6; // RFC3339
  int32 frequency_seconds = 7;
}

message VMCheckpoint {
  string name = 1;
  string parent_name = 2;
  string type = 3;
  string created_at = 4; // RFC3339
  bool is_current = 5;
}
